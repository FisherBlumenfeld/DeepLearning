# pyproject.toml.jinja

[project]
name = "hw07"
version = "0.1.0"
description = "My new homework assignment."
readme = "README.md"
authors = [
    { name = "Fisher Blumenfeld", email = "fisher.blumenfeld@cooper.edu" }
]
requires-python = ">=3.13"
dependencies = [
    "structlog",
    "rich",
    "numpy",
    "pydantic",
    "pydantic-settings>=2.10.1",
    "matplotlib>=3.10.5",
    "tqdm>=4.67.1",
    "jax[cpu]>=0.7.1",
    "flax>=0.11.2",
    "optax>=0.2.4",
    "scikit-learn",
    "datasets==5.0.1",
    "transformers==5.5.4",
    "optimum==2.3.0",
    "optimum-intel==2.2.0",
    "openvino==2026.4.1",
]

[project.scripts]
hw07 = "hw07:main"
hw07-evaluate = "hw07.evaluate:main"
[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"
